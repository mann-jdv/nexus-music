# Nexus Music release version. Upstream never has this file, so it never conflicts on sync.
#
# versionName = "<nexus.version>-nexus"           e.g. 1.0.0-nexus (debug builds add "-dev")
# versionCode = 1_000_000 + MAJOR*10_000 + MINOR*100 + PATCH   e.g. 1.0.0 -> 1010000
#
# The 1_000_000 offset keeps every Nexus code far above anything SimpMusic has shipped (62 at the
# 2.5.0 fork point) and leaves MINOR and PATCH 0..99 each. Bump the version here and nowhere else;
# upstream's version-name/version-code in gradle/libs.versions.toml are left alone so their bumps
# merge cleanly, and they are still exposed to the app as BuildKonfig.upstreamVersionName.
nexus.version=1.0.0
