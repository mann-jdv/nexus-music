# Nexus Music: compile check only. Uses no secrets, signs nothing, uploads nothing, publishes
# nothing. Upstream SimpMusic's release / nightly / desktop-package / PR-triage workflows were
# removed because they build and publish with upstream's signing keys, Sentry, Conveyor and
# release channels. Keep any new workflow named nexus-*.yml (scripts/sync-upstream.sh flags others).
# Note: core/ is a submodule whose URL (.gitmodules) is upstream's maxrave-dev/core. The Nexus core
# commits are local only, so this job can only check out core once they are pushed to a repo the
# submodule URL points at (see SYNC.md, "Where the core commits live").
name: Nexus build check

on:
  workflow_dispatch:
  push:
    branches: [ 'nexus/**' ]
  pull_request:
    branches: [ 'nexus/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: FOSS debug APK + Desktop compile + unit tests
        run: |
          chmod +x gradlew
          ./gradlew -PisFullBuild=false \
            :androidApp:assembleDebug \
            :composeApp:compileKotlinJvm \
            :domain:jvmTest
