name: Bug report
description: Something in Nexus Music doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nexus Music version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: apk
    attributes:
      label: Which APK did you install?
      placeholder: "arm64-v8a / armeabi-v7a / x86_64 / universal"
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
